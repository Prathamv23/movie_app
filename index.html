<!DOCTYPE html>
<html>
    <head>
        <title>Movie search</title>
        <link href="style.css" rel="stylesheet">
        <script src="script.js" type="module"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <header>
            <h2>🎥 Movie Box</h2>
        </header>
        <main>
            <section id="search">
                
                <form id="form">
                    <button id="favor">Favorites</button>
                    <input type="text" id="inp" placeholder="Search">
                    <button type="submit" id="sub">&#x1F50D;&#xFE0E;</button>
                </form>
            </section>
            <h1 id="status"></h1>
            <section>
                <p id="err"></p>
                <div id="movie-card">
                </div>
                <button id="load-more">Load More</button>
            </section>
        </main>
        
    </body>
</html>
